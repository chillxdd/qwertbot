name: Reliability regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-and-mongo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:installed
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017
          TEST_MONGO_ALLOW_TEST_DB: '1'
