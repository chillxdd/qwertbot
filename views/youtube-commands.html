<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <title>SqwertArmyBot YouTube Commands</title>
  <style>
    body{margin:0;background:#0b0e13;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:28px 18px}.card{background:#121720;border:1px solid #27303d;border-radius:16px;padding:20px}h1{margin-top:0}.cmd{padding:12px 0;border-top:1px solid #27303d}.cmd:first-of-type{border-top:0}code{font-size:1.05rem;color:#fff}.detail{color:#aeb7c4;margin-top:4px}.status{color:#aeb7c4}
  </style>
</head>
<body><main class="wrap"><div class="card"><div style="margin-bottom:14px"><a href="/" style="color:#aeb7c4;text-decoration:none">← Command platforms</a></div><h1>YouTube Commands</h1><div class="status" id="status">Loading…</div><div id="list"></div></div></main>
<script>
(async()=>{const s=document.getElementById('status'),l=document.getElementById('list');try{const r=await fetch('/youtube-public-commands',{cache:'no-store'}),d=await r.json();if(!d.success)throw new Error(d.error||'Unavailable');s.textContent=d.commands.length?`${d.commands.length} available command${d.commands.length===1?'':'s'}`:'No commands are enabled.';l.innerHTML=d.commands.map(c=>`<div class="cmd"><code>${String(c.trigger).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</code><div class="detail">${String(c.description||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</div></div>`).join('')}catch(e){s.textContent=e.message||'Could not load commands.'}})();
</script></body></html>
