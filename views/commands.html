<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <meta name="robots" content="index,follow">
  <title>SqwertArmyBot Commands</title>
  <link rel="stylesheet" href="/webui/styles.css">
</head>
<body class="public-commands-page">
  <main class="card public-commands-card">
    <div class="dashboard-header public-commands-header">
      <div>
        <h2>SqwertArmyBot Commands</h2>
        <div class="detail">Chat commands available to viewers.</div>
      </div>
    </div>

    <div class="readonly-commands-panel public-command-directory">
      <div class="subsection-nav readonly-command-tabs" role="tablist" aria-label="Public commands">
        <button id="readonlyCustomCommandsTab" class="secondary active" type="button" aria-selected="true">Custom Commands</button>
        <button id="readonlyNativeCommandsTab" class="secondary" type="button" aria-selected="false">Native Commands</button>
      </div>

      <section id="readonlyCustomCommandsView" class="subsection-view open">
        <div class="custom-command-header readonly-list-header">
          <div class="custom-command-list-controls">
            <label class="list-search-wrap" for="readonlyCustomCommandSearch">
              <span class="sr-only">Search public custom commands</span>
              <input id="readonlyCustomCommandSearch" class="list-search-input" type="search" placeholder="Search commands..." autocomplete="off" aria-label="Search public custom commands">
            </label>
            <label class="custom-command-sort-label" for="readonlyCustomCommandUserLevelFilter">User Level
              <select id="readonlyCustomCommandUserLevelFilter" aria-label="Filter public custom commands by user level">
                <option value="all">All Levels</option>
                <option value="everyone">Everyone</option>
                <option value="subscriber">Subscriber</option>
                <option value="twitch_vip">VIP</option>
              </select>
            </label>
            <label class="custom-command-sort-label" for="readonlyCustomCommandSort">Sort
              <select id="readonlyCustomCommandSort" aria-label="Sort public custom commands">
                <option value="name_asc">Name — A to Z</option>
                <option value="name_desc">Name — Z to A</option>
                <option value="cooldown_asc">Cooldown — lowest first</option>
                <option value="cooldown_desc">Cooldown — highest first</option>
              </select>
            </label>
          </div>
        </div>
        <div id="readonlyCustomCommandList" class="custom-command-list"></div>
        <div id="readonlyCustomCommandsMsg" class="detail"></div>
        <div id="readonlyCustomCommandPagination" class="list-pagination" aria-label="Public custom command pagination">
          <label class="list-page-size">Show
            <select id="readonlyCustomCommandPageSize" aria-label="Public custom commands per page">
              <option value="10">10</option><option value="25">25</option><option value="50">50</option>
            </select>
          </label>
          <div id="readonlyCustomCommandPageLabel" class="list-page-label">Page 1 of 1</div>
          <div class="list-page-buttons">
            <button id="readonlyCustomCommandPrevPage" class="secondary" type="button" aria-label="Previous public custom command page">←</button>
            <button id="readonlyCustomCommandNextPage" class="secondary" type="button" aria-label="Next public custom command page">→</button>
          </div>
        </div>
      </section>

      <section id="readonlyNativeCommandsView" class="subsection-view">
        <div class="custom-command-header readonly-list-header">
          <div class="custom-command-list-controls">
            <label class="list-search-wrap" for="readonlyNativeCommandSearch">
              <span class="sr-only">Search public native commands</span>
              <input id="readonlyNativeCommandSearch" class="list-search-input" type="search" placeholder="Search commands..." autocomplete="off" aria-label="Search public native commands">
            </label>
            <label class="custom-command-sort-label" for="readonlyNativeCommandUserLevelFilter">User Level
              <select id="readonlyNativeCommandUserLevelFilter" aria-label="Filter public native commands by user level">
                <option value="all">All Levels</option>
                <option value="everyone">Everyone</option>
                <option value="subscriber">Subscriber</option>
                <option value="twitch_vip">VIP</option>
              </select>
            </label>
            <label class="custom-command-sort-label" for="readonlyNativeCommandSort">Sort
              <select id="readonlyNativeCommandSort" aria-label="Sort public native commands">
                <option value="name_asc">Name — A to Z</option>
                <option value="name_desc">Name — Z to A</option>
              </select>
            </label>
          </div>
        </div>
        <div id="readonlyNativeCommandList" class="native-command-list"></div>
        <div id="readonlyNativeCommandsMsg" class="detail"></div>
        <div id="readonlyNativeCommandPagination" class="list-pagination" aria-label="Public native command pagination">
          <label class="list-page-size">Show
            <select id="readonlyNativeCommandPageSize" aria-label="Public native commands per page">
              <option value="10">10</option><option value="25">25</option><option value="50">50</option>
            </select>
          </label>
          <div id="readonlyNativeCommandPageLabel" class="list-page-label">Page 1 of 1</div>
          <div class="list-page-buttons">
            <button id="readonlyNativeCommandPrevPage" class="secondary" type="button" aria-label="Previous public native command page">←</button>
            <button id="readonlyNativeCommandNextPage" class="secondary" type="button" aria-label="Next public native command page">→</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/webui/commands.js"></script>
</body>
</html>
